<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>gerador @vernaculando</title>

<style>

body{
  margin:0;
  padding:40px 20px;
  background:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  font-size:18px;
  font-weight:bold;
  margin-bottom:25px;
}

input{
  width:100%;
  max-width:500px;
  padding:12px;
  font-size:18px;
  text-align:center;
}

button{
  margin-top:12px;
  padding:8px 18px;
  border:1px solid #000;
  background:#000;
  color:#fff;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.resultado{
  margin-top:40px;
  display:flex;
  justify-content:center;
  overflow-x:auto;
}

.resultado img{
  width:160px;
  height:160px;
  object-fit:cover;
  flex-shrink:0;
}

.msg{
  margin-top:30px;
  font-size:14px;
}

</style>
</head>

<body>

<h1>gerador @vernaculando</h1>

<input
id="palavra"
placeholder="Digite uma palavra"
>

<br>

<button onclick="gerar()">
GERAR!
</button>

<div id="resultado" class="resultado"></div>

<div id="msg" class="msg"></div>

<script>

const RSS =
"https://rss.app/feeds/4aUmbnZaAmP38RRZ.xml";

let catalogo = null;

async function carregarCatalogo(){

  const resposta =
    await fetch(RSS);

  const xml =
    await resposta.text();

  const itens =
    xml.split("<item>");

  const letras = {};

  itens.forEach(item => {

    const hashtag =
      item.match(/#([A-Z])\b/);

    const imagem =
      item.match(
        /<media:content[^>]*url="([^"]+)"/
      );

    if(!hashtag || !imagem)
      return;

    const letra =
      hashtag[1];

    const url =
      imagem[1];

    if(!letras[letra])
      letras[letra] = [];

    letras[letra].push(url);

  });

  catalogo = letras;

}

async function gerar(){

  document
    .getElementById("msg")
    .innerHTML = "";

  if(!catalogo){

    await carregarCatalogo();

  }

  const palavra =
    document
      .getElementById("palavra")
      .value
      .toUpperCase();

  const resultado =
    document
      .getElementById("resultado");

  resultado.innerHTML = "";

  let encontrou = false;

  for(const letra of palavra){

    if(!catalogo[letra])
      continue;

    encontrou = true;

    const lista =
      catalogo[letra];

    const url =
      lista[
        Math.floor(
          Math.random() *
          lista.length
        )
      ];

    const img =
      document.createElement("img");

    img.src = url;

    resultado.appendChild(img);

  }

  if(!encontrou){

    document
      .getElementById("msg")
      .innerHTML =
      "Nenhuma letra encontrada no feed atual.";

  }

}

</script>

</body>
</html>
