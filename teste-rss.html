<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Teste RSS Vernaculando</title>
</head>
<body>

<h1>Letras encontradas</h1>

<button onclick="carregar()">
Carregar RSS
</button>

<pre id="saida"></pre>

<script>

async function carregar(){

  const saida =
    document.getElementById("saida");

  try{

    const rss =
      await fetch(
        "https://rss.app/feeds/4aUmbnZaAmP38RRZ.xml"
      );

    const texto =
      await rss.text();

    const parser =
      new DOMParser();

    const xml =
      parser.parseFromString(
        texto,
        "text/xml"
      );

    const itens =
      xml.querySelectorAll("item");

    let resultado = "";

    itens.forEach(item => {

      const titulo =
        item.querySelector("title")
          ?.textContent || "";

      const media =
        item.querySelector("media\\:content");

      const imagem =
        media?.getAttribute("url") ||
        "SEM IMAGEM";

      resultado +=
        "TAGS: " + titulo + "\n\n";

      resultado +=
        "IMAGEM:\n" + imagem + "\n\n";

      resultado +=
        "----------------------\n\n";

    });

    saida.textContent =
      resultado;

  }

  catch(e){

    saida.textContent =
      "Erro: " + e.message;

  }

}

</script>

</body>
</html>
