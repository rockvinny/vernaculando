<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Teste RSS Vernaculando</title>
</head>
<body>

<h1>Letras encontradas</h1>

<button onclick="carregar()">
Carregar RSS
</button>

<pre id="saida"></pre>

<script>

async function carregar(){

  const saida =
    document.getElementById("saida");

  const rss =
    await fetch(
      "https://rss.app/feeds/4aUmbnZaAmP38RRZ.xml"
    );

  const texto =
    await rss.text();

  const match =
    texto.match(/https:\/\/ipxy\.io\/img\/[^"]+/);

  saida.textContent =
    match
      ? match[0]
      : "Nenhuma URL IPXY encontrada";

}

  catch(e){

    saida.textContent =
      "Erro: " + e.message;

  }

}

</script>

</body>
</html>
