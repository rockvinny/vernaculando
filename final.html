<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vernaculando</title>

<style>
body{
  margin:0;
  background:#fff;
  color:#000;
  font-family:Arial,sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:40px 20px;
  text-align:center;
}

h1{
  font-size:16px;
  font-weight:700;
  letter-spacing:.08em;
  margin-bottom:25px;
}

input{
  width:100%;
  max-width:500px;
  padding:12px;
  font-size:18px;
  text-align:center;
}

button{
  margin-top:12px;
  padding:8px 18px;
  border:1px solid #000;
  background:#000;
  color:#fff;
  font-size:13px;
  font-weight:600;
  letter-spacing:.05em;
  cursor:pointer;
}

.resultado{
  margin-top:30px;
  display:flex;
  overflow-x:auto;
}

.resultado img{
  width:160px;
  height:160px;
  object-fit:cover;
  flex-shrink:0;
}
</style>

</head>

<body>

<div class="container">

<h1>gerador @vernaculando</h1>

<input id="palavra" placeholder="Digite uma palavra">

<br>

<button onclick="compor()">GERAR!</button>

<div class="resultado" id="resultado"></div>

</div>

<script>

// ================================
// ALFABETO DINÂMICO (VERCEL API)
// ================================

let letras = {};

// carrega o alfabeto do backend
fetch("/api/alphabet")
  .then(r => r.json())
  .then(data => {
    letras = data;
    console.log("Alfabeto carregado:", letras);
  })
  .catch(err => {
    console.error("Erro ao carregar alfabeto:", err);
  });

// ================================
// FUNÇÃO PRINCIPAL
// ================================

function compor(){

  const palavra =
    document.getElementById("palavra")
    .value
    .toUpperCase();

  const resultado =
    document.getElementById("resultado");

  resultado.innerHTML = "";

  for(const letra of palavra){

    const imagens = letras[letra];

    if(imagens && imagens.length > 0){

      // escolhe imagem aleatória da letra
      const imgUrl =
        imagens[Math.floor(Math.random() * imagens.length)];

      const img =
        document.createElement("img");

      img.src = imgUrl;

      resultado.appendChild(img);

    } else {

      // fallback visual (mantém layout intacto)
      const vazio =
        document.createElement("div");

      vazio.style.width = "160px";
      vazio.style.height = "160px";
      vazio.style.display = "flex";
      vazio.style.alignItems = "center";
      vazio.style.justifyContent = "center";
      vazio.style.border = "1px solid #000";

      vazio.innerText = letra;

      resultado.appendChild(vazio);

    }

  }

}

</script>

</body>
</html>
