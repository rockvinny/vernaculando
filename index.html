<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gerador.vernaculando</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{
  margin:0;
  background:#fff;
  color:#000;
  font-family:'Rubik', sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:40px 20px;
  text-align:center;
}

h1{
  font-size:16px;
  font-weight:700;
  letter-spacing:.08em;
  margin-bottom:10px;
}

input{
  width:100%;
  max-width:280px;
  padding:10px;
  font-size:16px;
  text-align:center;
  border:1px solid #ccc;
  outline:none;
}

button{
  margin-top:12px;
  padding:8px 18px;
  border:1px solid #000;
  background:#000;
  color:#fff;
  font-size:13px;
  font-weight:600;
  letter-spacing:.05em;
  cursor:pointer;
}

.resultado{
  margin-top:30px;
  display:flex;
  flex-wrap:nowrap;
  justify-content:center;
  overflow-x:auto;
  gap:0px;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
  overscroll-behavior-x:contain;
}

.resultado img{
  width:clamp(80px, 20vw, 160px);
  height:clamp(80px, 20vw, 160px);
  object-fit:cover;
  flex-shrink:0;
}

.erro{
  color:#999;
  font-size:14px;
  margin-top:20px;
}

.insta-link{
  display:inline-block;
  margin-top:20px;
  font-size:13px;
  font-weight:400;
  color:#000;
  text-decoration:none;
  padding:2px 6px;
  transition:background 0.2s;
}

.insta-link:hover{
  background:#ffff00;
}

.download-link{
  font-size:13px;
  font-weight:400;
  color:#000;
  text-decoration:none;
  cursor:pointer;
  transition:background 0.2s;
  padding:2px 4px;
}

.download-link:hover{
  background:#ffff00;
}
</style>

</head>
<body>

<div class="container">

<h1>gerador.vernaculando <span style="font-size:11px; color:#999;">beta</span></h1>

<input
id="palavra"
placeholder="palavra | palabra | word"
maxlength="20"
>

<br>

<button onclick="compor()">
vernacular!
</button>

<div class="resultado" id="resultado"></div>

<div class="erro" id="erro"></div>

<div id="download-area" style="text-align:center; margin-top:20px; display:none;">
  <span style="font-size:13px;">download: </span>
  <a onclick="sticker()" class="download-link">sticker</a>
  <span style="font-size:13px;"> | </span>
  <a onclick="post()" class="download-link">post</a>
  <span style="font-size:13px;"> | </span>
  <a onclick="story()" class="download-link">story</a>
</div>

<div id="link-instagram" style="text-align:center; display:none;">
  <a href="https://instagram.com/vernaculando" target="_blank" class="insta-link">instagram @vernaculando</a>
</div>

<div style="position:fixed; bottom:10px; left:0; right:0; text-align:center; font-size:11px; color:#bbb;">
  feito por Vinicius Guimarães & DeepSeek
</div>

</div>

<script>

// ========== CONFIGURAÇÃO ==========
const RSS_URL = "https://rss.app/feeds/v1.1/4aUmbnZaAmP38RRZ.json";

// ========== CARREGA TUDO ==========
let letrasCompletas = {};

async function carregarLetras() {
  const respLocal = await fetch("/letras.json");
  const dadosLocais = await respLocal.json();
  
  try {
    const respRSS = await fetch(RSS_URL);
    const dadosRSS = await respRSS.json();
    
    for (const item of dadosRSS.items || []) {
      const legenda = (item.content_text || item.title || "").toUpperCase();
      const matchLetra = legenda.match(/#[A-Z0-9]\b/gi);

      if (matchLetra) {
        for (const tag of matchLetra) {
          const letra = tag.replace("#", "").toUpperCase();
          if (letra.length !== 1) continue;
          const imagem = item.image || item.enclosure?.url || "";
          
          if (imagem) {
            if (!dadosLocais[letra]) dadosLocais[letra] = [];
            if (!dadosLocais[letra].includes(imagem)) {
              dadosLocais[letra].push(imagem);
            }
          }
        }
      }
    }
  } catch (e) {
    console.log("RSS não carregado, usando só base local");
  }
  
  letrasCompletas = dadosLocais;
}

// ========== FUNÇÃO PRINCIPAL ==========
function compor() {
  const palavraInput = document.getElementById("palavra").value;
  const resultado = document.getElementById("resultado");
  const erro = document.getElementById("erro");
  
  resultado.innerHTML = "";
  erro.innerHTML = "";
  
  if (!palavraInput) {
    erro.innerHTML = "digite uma palavra<br>escribe una palabra<br>type a word";
    document.getElementById("link-instagram").style.display = "none";
    document.getElementById("download-area").style.display = "none";
    return;
  }
  
  const mapa = {
    "Á": "a_acute", "À": "a", "Â": "a", "Ã": "a_tilde", "Ä": "a",
    "É": "e_acute", "Ê": "e", "Ë": "e",
    "Í": "i_acute", "Ï": "i",
    "Ó": "o_acute", "Ô": "o", "Õ": "o", "Ö": "o",
    "Ú": "u_acute", "Ü": "u",
    "Ç": "c_cedilha",
    "Ñ": "n",
    "@": "arroba",
    "&": "ampersand"
  };
  
  const caracteres = palavraInput.split("");
  
  const contador = {};
  const opcoesDisponiveis = {};
  
  for (const char of caracteres) {
    const charUpper = char.toUpperCase();
    const chave = mapa[charUpper] || charUpper.toLowerCase();
    
    if (!contador[chave]) {
      contador[chave] = 0;
      const todasOpcoes = letrasCompletas[chave] || letrasCompletas[chave.toLowerCase()] || letrasCompletas[chave.toUpperCase()] || [];
      opcoesDisponiveis[chave] = [...todasOpcoes];
    }
    contador[chave]++;
  }
  
  for (const chave in opcoesDisponiveis) {
    const arr = opcoesDisponiveis[chave];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }
  
  for (const char of caracteres) {
    const charUpper = char.toUpperCase();
    const chave = mapa[charUpper] || charUpper.toLowerCase();
    let opcoes = opcoesDisponiveis[chave];
    
    if (!opcoes || opcoes.length === 0) {
      const todasOpcoes = letrasCompletas[chave] || letrasCompletas[chave.toLowerCase()] || letrasCompletas[chave.toUpperCase()] || [];
      opcoes = [...todasOpcoes];
      for (let i = opcoes.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [opcoes[i], opcoes[j]] = [opcoes[j], opcoes[i]];
      }
      opcoesDisponiveis[chave] = opcoes;
    }
    
    if (opcoes && opcoes.length > 0) {
      const img = document.createElement("img");
      const imagem = opcoes.shift();
      img.src = imagem;
      img.alt = char;
      img.title = `Letra ${char}`;
      resultado.appendChild(img);
    } else {
      const span = document.createElement("span");
      span.style.cssText = "width:clamp(80px, 20vw, 160px);height:clamp(80px, 20vw, 160px);border:2px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:clamp(20px, 5vw, 40px);color:#ccc;";
      span.innerHTML = char;
      resultado.appendChild(span);
    }
  }
  
  document.getElementById("link-instagram").style.display = "block";
  document.getElementById("download-area").style.display = "block";
}

// ========== STICKER (512x512, transparente, sem crédito) ==========
function sticker() {
  const palavra = document.getElementById("palavra").value.toUpperCase();
  const resultado = document.getElementById("resultado");
  const numLetras = resultado.children.length;
  
  const tamanhoLetra = Math.min(100, Math.floor(400 / numLetras));
  
  const container = document.createElement("div");
  container.style.cssText = "display:flex; flex-wrap:nowrap; gap:0; justify-content:center; align-items:center;";
  
  const imgsOriginais = resultado.querySelectorAll("img");
  imgsOriginais.forEach(img => {
    const novaImg = document.createElement("img");
    novaImg.src = img.src;
    novaImg.alt = img.alt;
    novaImg.style.width = tamanhoLetra + "px";
    novaImg.style.height = tamanhoLetra + "px";
    novaImg.style.objectFit = "cover";
    container.appendChild(novaImg);
  });
  
  const wrapper = document.createElement("div");
  wrapper.style.cssText = "display:flex; align-items:center; justify-content:center; width:512px; height:512px; background:transparent;";
  wrapper.appendChild(container);
  
  document.body.appendChild(wrapper);
  
  html2canvas(wrapper, { backgroundColor: null, scale: 1 }).then(canvas => {
    document.body.removeChild(wrapper);
    const link = document.createElement("a");
    link.download = "vernaculando_" + palavra + "_sticker.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

// ========== POST (1080x540, moldura branca, com crédito) ==========
function post() {
  const palavra = document.getElementById("palavra").value.toUpperCase();
  const resultado = document.getElementById("resultado");
  const numLetras = resultado.children.length;
  
  const margem = 120;
  const larguraDisponivel = 1080 - margem;
  const tamanhoLetra = Math.min(800, Math.floor(larguraDisponivel / numLetras));
  
  const container = document.createElement("div");
  container.style.cssText = "display:flex; flex-wrap:nowrap; gap:0; justify-content:center; align-items:center;";
  
  const imgsOriginais = resultado.querySelectorAll("img");
  imgsOriginais.forEach(img => {
    const novaImg = document.createElement("img");
    novaImg.src = img.src;
    novaImg.alt = img.alt;
    novaImg.style.width = tamanhoLetra + "px";
    novaImg.style.height = tamanhoLetra + "px";
    novaImg.style.objectFit = "cover";
    container.appendChild(novaImg);
  });
  
  const inner = document.createElement("div");
  inner.style.cssText = "display:flex; flex-direction:column; align-items:center; justify-content:center;";
  inner.appendChild(container);
  
  const credito = document.createElement("div");
  credito.style.cssText = "font-family:'Rubik', sans-serif; font-size:28px; color:#999; margin-top:40px;";
  credito.innerText = "gerador.vernaculando";
  inner.appendChild(credito);
  
  const wrapper = document.createElement("div");
  wrapper.style.cssText = "display:flex; align-items:center; justify-content:center; width:1080px; height:1080px; background:#fff; padding:0 60px; box-sizing:border-box;";
  wrapper.appendChild(inner);
  
  document.body.appendChild(wrapper);
  
  html2canvas(wrapper, { backgroundColor: "#fff", scale: 1 }).then(canvas => {
    document.body.removeChild(wrapper);
    const link = document.createElement("a");
    link.download = "vernaculando_" + palavra + "_post.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

// ========== STORY (1080x1920, moldura branca, com crédito) ==========
function story() {
  const palavra = document.getElementById("palavra").value.toUpperCase();
  const resultado = document.getElementById("resultado");
  const numLetras = resultado.children.length;
  
  const margem = 120;
  const larguraDisponivel = 1080 - margem;
  const tamanhoLetra = Math.min(800, Math.floor(larguraDisponivel / numLetras));
  
  const container = document.createElement("div");
  container.style.cssText = "display:flex; flex-wrap:nowrap; gap:0; justify-content:center; align-items:center;";
  
  const imgsOriginais = resultado.querySelectorAll("img");
  imgsOriginais.forEach(img => {
    const novaImg = document.createElement("img");
    novaImg.src = img.src;
    novaImg.alt = img.alt;
    novaImg.style.width = tamanhoLetra + "px";
    novaImg.style.height = tamanhoLetra + "px";
    novaImg.style.objectFit = "cover";
    container.appendChild(novaImg);
  });
  
  const inner = document.createElement("div");
  inner.style.cssText = "display:flex; flex-direction:column; align-items:center; justify-content:center;";
  inner.appendChild(container);
  
  const credito = document.createElement("div");
  credito.style.cssText = "font-family:'Rubik', sans-serif; font-size:28px; color:#999; margin-top:60px;";
  credito.innerText = "gerador.vernaculando";
  inner.appendChild(credito);
  
  const wrapper = document.createElement("div");
  wrapper.style.cssText = "display:flex; align-items:center; justify-content:center; width:1080px; height:1920px; background:#fff; padding:0 60px; box-sizing:border-box;";
  wrapper.appendChild(inner);
  
  document.body.appendChild(wrapper);
  
  html2canvas(wrapper, { backgroundColor: "#fff", scale: 1 }).then(canvas => {
    document.body.removeChild(wrapper);
    const link = document.createElement("a");
    link.download = "vernaculando_" + palavra + "_story.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

// ========== INICIA ==========
carregarLetras();

document.getElementById("palavra").addEventListener("keydown", function(e) {
  if (e.key === "Enter") compor();
});

</script>

</body>
</html>
