<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gerador.vernaculando</title>

<style>
body{
  margin:0;
  background:#fff;
  color:#000;
  font-family:Arial,sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:40px 20px;
  text-align:center;
}

h1{
  font-size:16px;
  font-weight:700;
  letter-spacing:.08em;
  margin-bottom:25px;
}

input{
  width:100%;
  max-width:280px;
  padding:12px;
  font-size:16px;
  text-align:center;
}

button{
  margin-top:12px;
  padding:8px 18px;
  border:1px solid #000;
  background:#000;
  color:#fff;
  font-size:13px;
  font-weight:600;
  letter-spacing:.05em;
  cursor:pointer;
}

.resultado{
  margin-top:30px;
  display:flex;
  flex-wrap:nowrap;
  justify-content:center;
  overflow-x:auto;
  gap:0px;
}

.resultado img{
  width:clamp(80px, 20vw, 160px);
  height:clamp(80px, 20vw, 160px);
  object-fit:cover;
  flex-shrink:0;
}

.erro{
  color:#999;
  font-size:14px;
  margin-top:20px;
}

.insta-link{
  display:inline-block;
  margin-top:20px;
  font-size:13px;
  font-weight:400;
  color:#000;
  text-decoration:none;
  padding:2px 6px;
  transition:background 0.2s;
}

.insta-link:hover{
  background:#ffff00;
}
</style>

</head>
<body>

<div class="container">

<h1>gerador.vernaculando</h1>

<input
id="palavra"
placeholder="palavra  |  palabra  |  word"
maxlength="20"
>

<br>

<button onclick="compor()">
vernacular!
</button>

<div class="resultado" id="resultado"></div>

<div class="erro" id="erro"></div>

<div id="link-instagram" style="text-align:center; display:none;">
  <a href="https://instagram.com/vernaculando" target="_blank" class="insta-link">instagram @vernaculando</a>
</div>

</div>

<script>

// ========== CONFIGURAÇÃO ==========
const RSS_URL = "https://rss.app/feeds/v1.1/4aUmbnZaAmP38RRZ.json";

// ========== CARREGA TUDO ==========
let letrasCompletas = {};

async function carregarLetras() {
  // 1. Carrega letras.json (base histórica)
  const respLocal = await fetch("/letras.json");
  const dadosLocais = await respLocal.json();
  
  // 2. Carrega RSS (posts novos)
  try {
    const respRSS = await fetch(RSS_URL);
    const dadosRSS = await respRSS.json();
    
    // Extrai hashtags do RSS
    for (const item of dadosRSS.items || []) {
      const legenda = (item.content_text || item.title || "").toUpperCase();
      const matchLetra = legenda.match(/#[A-Z0-9]\b/gi);

      if (matchLetra) {
        for (const tag of matchLetra) {
          const letra = tag.replace("#", "").toUpperCase();
          // Pula se tiver mais de 1 caractere
          if (letra.length !== 1) continue;
          const imagem = item.image || item.enclosure?.url || "";
          
          if (imagem && letra.length === 1) {
            if (!dadosLocais[letra]) dadosLocais[letra] = [];
            if (!dadosLocais[letra].includes(imagem)) {
              dadosLocais[letra].push(imagem);
            }
          }
        }
      }
    }
  } catch (e) {
    console.log("RSS não carregado, usando só base local");
  }
  
  letrasCompletas = dadosLocais;
  console.log("Letras carregadas:", Object.keys(letrasCompletas).length);
}

// ========== FUNÇÃO PRINCIPAL ==========
function compor() {
  const palavra = document.getElementById("palavra").value.toUpperCase();
  const resultado = document.getElementById("resultado");
  const erro = document.getElementById("erro");
  
  resultado.innerHTML = "";
  erro.innerHTML = "";
  
  if (!palavra) {
    erro.innerHTML = "Digite uma palavra!";
    document.getElementById("link-instagram").style.display = "none";
    return;
  }
  
  for (const letra of palavra) {
    const opcoes = letrasCompletas[letra] || letrasCompletas[letra.toLowerCase()] || [];
    
    if (opcoes && opcoes.length > 0) {
      const img = document.createElement("img");
      // Escolhe aleatoriamente
      img.src = opcoes[Math.floor(Math.random() * opcoes.length)];
      img.alt = letra;
      img.title = `Letra ${letra}`;
      resultado.appendChild(img);
    } else {
      const span = document.createElement("span");
      span.style.cssText = "width:160px;height:160px;border:2px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:40px;color:#ccc;";
      span.innerHTML = letra;
      resultado.appendChild(span);
    }
  }
  
  // Mostra o link do Instagram
  var link = document.getElementById("link-instagram");
  if (link) link.style.display = "block";
}

// ========== INICIA ==========
carregarLetras();

// Permite apertar Enter para gerar
document.getElementById("palavra").addEventListener("keydown", function(e) {
  if (e.key === "Enter") compor();
});

</script>

</body>
</html>
