<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vernaculando</title>

<style>
body{
  margin:0;
  background:#fff;
  color:#000;
  font-family:Arial,sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:40px 20px;
}

h1{
  letter-spacing:.15em;
}

input{
  width:100%;
  max-width:500px;
  padding:12px;
  font-size:18px;
}

button{
  margin-top:10px;
  padding:12px 24px;
}

.resultado{
  margin-top:30px;
  display:flex;
  overflow-x:auto;
}

.resultado img{
  width:160px;
  height:160px;
  object-fit:cover;
  flex-shrink:0;
}
</style>

</head>
<body>

<div class="container">

<h1>VERNACULANDO</h1>

<input
id="palavra"
placeholder="Digite uma palavra"
>

<br>

<button onclick="compor()">
COMPOR
</button>

<div class="resultado" id="resultado"></div>

</div>

<script>

const letras = {

"S":"imagens/Screenshot_20260615-231047_Instagram~2.png",

"E":"imagens/Screenshot_20260615-231057_Instagram~2.png",

"H":"imagens/Screenshot_20260615-231103_Instagram~2.png"

};

function compor(){

const palavra =
document.getElementById("palavra")
.value
.toUpperCase();

const resultado =
document.getElementById("resultado");

resultado.innerHTML = "";

for(const letra of palavra){

if(letras[letra]){

const img =
document.createElement("img");

img.src = letras[letra];

resultado.appendChild(img);

}

}

}

</script>

</body>
</html>
